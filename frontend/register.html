<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Expense Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div class="auth-container">
        <div class="auth-card card">
            <div class="auth-header">
                <h1>Expense Tracker</h1>
                <p>Create your account to start tracking expenses</p>
            </div>

            <form id="registerForm">
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <input type="text" id="username" class="form-control" placeholder="Choose a username" required
                        minlength="3">
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Create a password" required
                        minlength="6">
                    <small class="text-muted">Minimum 6 characters</small>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm your password"
                        required>
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                    <span id="registerBtnText">Create Account</span>
                    <span id="registerSpinner" class="hidden">
                        <div class="spinner spinner-sm" style="display: inline-block;"></div>
                    </span>
                </button>
            </form>

            <div style="text-align: center; margin-top: 1.5rem;">
                <p class="text-muted">
                    Already have an account?
                    <a href="login.html" style="color: var(--primary-light); text-decoration: none;">Login here</a>
                </p>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
