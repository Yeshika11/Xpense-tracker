<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Expense Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="container navbar-container">
            <a href="dashboard.html" class="navbar-brand">Expense Tracker</a>
            <ul class="navbar-nav">
                <li><a href="dashboard.html" class="nav-link active">Dashboard</a></li>
                <li><a href="expenses.html" class="nav-link">Expenses</a></li>
                <li><a href="monthly-report.html" class="nav-link">Reports</a></li>
                <li><a href="profile.html" class="nav-link">Profile</a></li>
                <li>
                    <div id="themeToggle" class="theme-toggle">
                        <div class="theme-toggle-slider"></div>
                    </div>
                </li>
                <li><button id="logoutBtn" class="btn btn-secondary btn-sm">Logout</button></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container" style="padding-top: 2rem; padding-bottom: 2rem;">
        <!-- Welcome -->
        <div class="mb-4">
            <h1 style="font-size: 2rem; margin-bottom: 0.5rem;">Welcome back, <span id="userName">User</span>!</h1>
            <p class="text-muted">Here's an overview of your expenses</p>
        </div>

        <!-- Stats Cards -->
        <div class="grid grid-cols-4 mb-4">
            <div class="stat-card">
                <div class="stat-label">Total Expenses</div>
                <div class="stat-value" id="totalExpenses">Rs. 0.00</div>
            </div>

            <div class="stat-card">
                <div class="stat-label">This Month</div>
                <div class="stat-value" id="monthlyExpenses">Rs. 0.00</div>
            </div>

            <div class="stat-card">
                <div class="stat-label">Total Transactions</div>
                <div class="stat-value" id="expenseCount">0</div>
            </div>

            <div class="stat-card">
                <div class="stat-label">Top Category</div>
                <div class="stat-value" id="topCategory" style="font-size: 1.25rem;">N/A</div>
            </div>
        </div>

        <!-- Charts -->
        <div class="grid grid-cols-2">

            <!-- Monthly Trend Chart -->
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">6-Month Trend</h3>
                </div>
                <div class="card-body">
                    <canvas id="trendChart" style="max-height: 300px;"></canvas>
                </div>
            </div>

            <!-- Recent Expenses -->
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h3 class="card-title">Recent Expenses</h3>
                    <a href="add-expense.html" class="btn btn-primary btn-sm" id="addExpenseBtn"
                        style="display: none;">+ Add New</a>
                </div>
                <div class="card-body">
                    <div id="recentExpenses">
                        <div class="text-center text-muted">
                            <div class="spinner" style="margin: 2rem auto;"></div>
                            <p>Loading...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="js/utils.js"></script>
    <script src="js/dashboard.js"></script>
</body>

</html>
