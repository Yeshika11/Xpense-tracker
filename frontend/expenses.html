<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expenses - Expense Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="container navbar-container">
            <a href="dashboard.html" class="navbar-brand">Expense Tracker</a>
            <ul class="navbar-nav">
                <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
                <li><a href="expenses.html" class="nav-link active">Expenses</a></li>
                <li><a href="monthly-report.html" class="nav-link">Reports</a></li>
                <li><a href="profile.html" class="nav-link">Profile</a></li>
                <li>
                    <div id="themeToggle" class="theme-toggle">
                        <div class="theme-toggle-slider"></div>
                    </div>
                </li>
                <li><button id="logoutBtn" class="btn btn-secondary btn-sm">Logout</button></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container" style="padding-top: 2rem; padding-bottom: 2rem;">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h2 class="card-title">All Expenses</h2>
                <a href="add-expense.html" class="btn btn-primary">+ Add Expense</a>
            </div>

            <div class="card-body">

                <!-- Filters -->
                <div class="grid grid-cols-4 mb-3">
                    <input type="text" id="searchInput" class="form-control" placeholder="Search by notes or amount...">

                    <select id="categoryFilter" class="form-control">
                        <option value="">All Categories</option>
                    </select>

                    <input type="date" id="startDate" class="form-control">
                    <input type="date" id="endDate" class="form-control">
                </div>

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div>
                        <label class="form-label" style="display: inline-block; margin-right: 1rem;">Sort by:</label>
                        <select id="sortBy" class="form-control" style="display: inline-block; width: auto;">
                            <option value="date">Date</option>
                            <option value="amount">Amount</option>
                            <option value="category_name">Category</option>
                        </select>
                        <select id="sortOrder" class="form-control"
                            style="display: inline-block; width: auto; margin-left: 0.5rem;">
                            <option value="DESC">Descending</option>
                            <option value="ASC">Ascending</option>
                        </select>
                    </div>

                    <button id="toggleView" class="btn btn-secondary btn-sm">📋 Switch to Cards</button>
                </div>

                <!-- Table View -->
                <div id="tableView">
                    <div class="table-wrapper">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Category</th>
                                    <th>Amount</th>
                                    <th>Notes</th>
                                    <th>Images</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="expensesTableBody">
                                <tr>
                                    <td colspan="6" class="text-center">
                                        <div class="spinner" style="margin: 2rem auto;"></div>
                                        <p class="text-muted">Loading expenses...</p>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Card View  -->
                <div id="cardView" class="hidden">
                    <div class="grid grid-cols-3" id="expensesCardContainer">
                        <div class="text-center">
                            <div class="spinner" style="margin: 2rem auto;"></div>
                            <p class="text-muted">Loading expenses...</p>
                        </div>
                    </div>
                </div>

                <!-- Pagination -->
                <div id="pagination" class="pagination"></div>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation -->
    <div id="deleteModal" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeDeleteModal()">&times;</button>
            <h3 style="margin-bottom: 1rem;">Confirm Delete</h3>
            <p class="text-muted">Are you sure you want to delete this expense? This action cannot be undone.</p>
            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <button class="btn btn-secondary" onclick="closeDeleteModal()">Cancel</button>
                <button class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="js/utils.js"></script>
    <script src="js/expenses.js"></script>
</body>

</html>
