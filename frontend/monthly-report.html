<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Report - Expense Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="container navbar-container">
            <a href="dashboard.html" class="navbar-brand">Expense Tracker</a>
            <ul class="navbar-nav">
                <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
                <li><a href="expenses.html" class="nav-link">Expenses</a></li>
                <li><a href="monthly-report.html" class="nav-link active">Reports</a></li>
                <li><a href="profile.html" class="nav-link">Profile</a></li>
                <li>
                    <div id="themeToggle" class="theme-toggle">
                        <div class="theme-toggle-slider"></div>
                    </div>
                </li>
                <li><button id="logoutBtn" class="btn btn-secondary btn-sm">Logout</button></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container" style="padding-top: 2rem; padding-bottom: 2rem;">
        <div class="card mb-3">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h2 class="card-title">Monthly Expense Report</h2>
                <div style="display: flex; gap: 1rem; align-items: center;">
                    <select id="monthSelect" class="form-control" style="width: auto;">
                        <option value="1">January</option>
                        <option value="2">February</option>
                        <option value="3">March</option>
                        <option value="4">April</option>
                        <option value="5">May</option>
                        <option value="6">June</option>
                        <option value="7">July</option>
                        <option value="8">August</option>
                        <option value="9">September</option>
                        <option value="10">October</option>
                        <option value="11">November</option>
                        <option value="12">December</option>
                    </select>
                    <select id="yearSelect" class="form-control" style="width: auto;">


                    </select>
                    <button id="generateReport" class="btn btn-primary">Generate</button>
                </div>
            </div>

            <div class="card-body">
                <div id="reportLoader" class="text-center">
                    <div class="spinner" style="margin: 2rem auto;"></div>
                    <p class="text-muted">Loading report...</p>
                </div>

                <div id="reportContent" class="hidden">

                    <!-- Total Amount -->
                    <div class="stat-card mb-3" style="text-align: center;">
                        <div class="stat-label">Total Expenses</div>
                        <div class="stat-value" id="reportTotal">Rs. 0.00</div>
                    </div>

                    <div class="grid grid-cols-2">

                        <!-- Category Breakdown Chart -->
                        <div class="card">
                            <div class="card-header">
                                <h3 class="card-title">Category Breakdown</h3>
                            </div>
                            <div class="card-body">
                                <canvas id="categoryChart"></canvas>
                            </div>
                        </div>

                        <!-- Category Details -->
                        <div class="card">
                            <div class="card-header">
                                <h3 class="card-title">Category Details</h3>
                            </div>
                            <div class="card-body">
                                <div id="categoryBreakdown">

                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="noDataMessage" class="hidden text-center" style="padding: 4rem;">
                    <div style="font-size: 4rem; margin-bottom: 1rem;"></div>
                    <h3>No expenses found</h3>
                    <p class="text-muted">No expenses recorded for the selected month</p>
                    <a href="add-expense.html" class="btn btn-primary mt-2">Add New Expense</a>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="js/utils.js"></script>
    <script src="js/monthly-report.js"></script>
</body>

</html>
